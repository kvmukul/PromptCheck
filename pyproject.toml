[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcheck"
version = "0.1.0"
description = "Unit tests and regression checks for LLM prompts. Zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "prompt", "testing", "evaluation", "regression", "ci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
promptcheck = "promptcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
